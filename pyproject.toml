[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "mavdac"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "matplotlib>=3.7.5",
    "click>=8.4.1",
    "scipy-stubs>=1.17.1.5",
]
authors = [{ name = "Jesse Cranney", email = "jesse.cranney@anu.edu.au" }]
description = "MAVIS Differential Astrometric Calibrations"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "mavisim>=1.1.13",
    "scipy>=1.17.1",
    "astropy>=8.0.2",
    "pydantic>=2.13.4",
    "mypy>=2.4.0",
]

[tool.maturin]
python-source = "python"

[project.scripts]
mavdac = "mavdac.__main__:__name__"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "**/*.rs" },
]
